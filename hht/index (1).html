<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Datalogic Asset Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="screen-header">
            <h1>Asset Scanner Setup</h1>
            <p>Configure scanning parameters</p>
        </div>
        
        <div class="setup-form">
            <div class="form-group">
                <label for="iataCode" class="form-label">IATA Code / Site Name</label>
                <input type="text" id="iataCode" class="form-control" placeholder="Enter IATA code or site name" required>
            </div>
            
            <div class="form-group">
                <label for="modelSelect" class="form-label">Model Name</label>
                <select id="modelSelect" class="form-control" required>
                    <option value="">Select a model...</option>
                    <option value="ecran p204v">ecran p204v</option>
                    <option value="TK180">Imprimante Custom TK180</option>
                    <option value="IDENTY CHROME -MINI MPR">IDENTY CHROME -MINI MPR</option>
                    <option value="EPSON FX 890II PRINTER">EPSON FX 890II PRINTER</option>
                    <option value="BGR 504 pro">BGR 504 pro</option>
                    <option value="CHARGER 4 SLOT BATTERY MEMOR 20">CHARGER 4 SLOT BATTERY MEMOR 20</option>
                    <option value="MEMOR 20 HHT">MEMOR 20 HHT</option>
                    <option value="HP EliteDesk 800 G6">HP EliteDesk 800 G6</option>
					<option value="Workstation G9">Workstation G9</option>
					<option value="Ecran P22 G5">Ecran P22 G5</option>
					<option value="ecran v197">ecran v197</option>
					<option value="printer oki ml3320">printer oki ml3320</option>
					<option value="printer hp laserjet m402n">printer hp laserjet m402n</option>
					<option value="printer hp laserjet m507">printer hp laserjet m507</option>
                </select>
            </div>
            
            <button id="startScanningBtn" class="btn btn--primary btn--lg btn--full-width">
                Start Scanning
            </button>
        </div>
    </div>

    <!-- Scanning Screen -->
    <div id="scanningScreen" class="screen">
        <div class="scanning-header">
            <div class="scanning-info">
                <h2>Asset Scanning Active</h2>
                <div class="session-info">
                    <span id="currentIata" class="info-item"></span>
                    <span id="currentModel" class="info-item"></span>
                </div>
            </div>
            <button id="backToSetupBtn" class="btn btn--outline btn--sm">Back to Setup</button>
        </div>

        <div class="scanning-area">
            <div class="scan-zone">
                <div class="scan-target">
                    <div class="scan-crosshair">
                        <div class="crosshair-line horizontal"></div>
                        <div class="crosshair-line vertical"></div>
                    </div>
                    <p class="scan-instruction">Position barcode within target area</p>
                </div>
            </div>

            <div class="manual-input-section">
                <div class="input-group">
                    <input type="text" id="manualBarcodeInput" class="form-control" placeholder="Manual barcode entry or scan here">
                    <select id="barcodeType" class="form-control type-selector">
                        <option value="SerialNumber">Serial Number</option>
                        <option value="AssetTag">Asset Tag</option>
                    </select>
                </div>
                <div class="input-actions">
                    <button id="addBarcodeBtn" class="btn btn--primary">Add Entry</button>
                    <button id="generateSampleBtn" class="btn btn--secondary">Generate Sample</button>
                </div>
            </div>
        </div>

        <div class="scanned-results">
            <div class="results-header">
                <h3>Scanned Items (<span id="itemCount">0</span>)</h3>
                <button id="clearAllBtn" class="btn btn--outline btn--sm">Clear All</button>
            </div>
            
            <div class="results-table-container">
                <table id="resultsTable" class="results-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Value</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- Scanned results will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="scanning-actions">
            <button id="saveExportBtn" class="btn btn--primary btn--lg btn--full-width">
                Save & Export CSV
            </button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h3>Export Successful</h3>
            <p id="successMessage">Your asset data has been exported successfully.</p>
            <button id="closeModalBtn" class="btn btn--primary">Continue Scanning</button>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h3>Error</h3>
            <p id="errorMessage">Please check your inputs and try again.</p>
            <button id="closeErrorBtn" class="btn btn--primary">OK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
